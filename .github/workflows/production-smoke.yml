name: Production Smoke

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  schedule:
    # One readiness request each hour; the full browser/asset suite runs daily.
    - cron: "17 * * * *"
    - cron: "41 7 * * *"

permissions:
  contents: read

env:
  DENO_VERSION: 2.8.3

jobs:
  readiness:
    name: Cheap production readiness
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      source_sha: ${{ steps.release_scope.outputs.source_sha }}
      artifact_digest: ${{ steps.release_scope.outputs.artifact_digest }}
      allowed_appview_shas: ${{ steps.release_scope.outputs.allowed_appview_shas }}

    steps:
      - name: Checkout release
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Manual and scheduled checks always inspect trusted main. A
          # workflow_run checks the exact trusted main commit that passed CI.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'refs/heads/main' }}
          # Worker-only commits still verify the nearest prior web artifact.
          # Full first-parent history is required to resolve that SHA.
          fetch-depth: 0

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
          cache: true

      - name: Determine the expected web artifact release
        id: release_scope
        run: |
          source_sha="$(git rev-parse --verify HEAD^{commit})"
          artifact_digest="$(deno task release:web-digest)"
          allowed_appview_shas="$(deno task release:web-changed -- \
            --sha="$source_sha" --allowed-appview-shas)"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$artifact_digest" >> "$GITHUB_OUTPUT"
          echo "allowed_appview_shas=$allowed_appview_shas" >> "$GITHUB_OUTPUT"

      - name: Wait for a release-compatible artifact, or check once on schedule
        env:
          SMOKE_EXPECT_ARTIFACT_DIGEST: ${{ steps.release_scope.outputs.artifact_digest }}
          SMOKE_ALLOWED_APPVIEW_SHAS: ${{ steps.release_scope.outputs.allowed_appview_shas }}
          POST_DEPLOY: ${{ github.event_name == 'workflow_run' && '1' || '0' }}
        run: |
          attempts=1
          # Deno and Railway build/promote independently. Allow up to 15
          # minutes for the exact web digest and an allowed AppView revision.
          if [ "$POST_DEPLOY" = "1" ]; then attempts=30; fi
          for attempt in $(seq 1 "$attempts"); do
            if deno task smoke:readiness; then exit 0; fi
            if [ "$attempt" -lt "$attempts" ]; then sleep 30; fi
          done
          exit 1

  full:
    name: Full production smoke suite
    needs: readiness
    if: >-
      needs.readiness.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event_name == 'workflow_run' ||
       github.event.schedule == '41 7 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout release
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Bind the full suite to the exact trusted source resolved by
          # readiness even if main advances while this workflow is running.
          ref: ${{ needs.readiness.outputs.source_sha }}

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
          cache: true

      - name: Smoke production
        env:
          SMOKE_EXPECT_ARTIFACT_DIGEST: ${{ needs.readiness.outputs.artifact_digest }}
          SMOKE_ALLOWED_APPVIEW_SHAS: ${{ needs.readiness.outputs.allowed_appview_shas }}
        run: deno task smoke:production

  alert:
    name: Reconcile production alert
    needs: [readiness, full]
    if: >-
      always() &&
      github.event_name != 'workflow_dispatch' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: production-smoke-alert-reconciliation
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout release history
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.readiness.outputs.source_sha || github.event.workflow_run.head_sha || 'refs/heads/main' }}
          fetch-depth: 0

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
          cache: true

      - name: Reconcile authoritative alert generations
        env:
          SOURCE_SHA: ${{ needs.readiness.outputs.source_sha }}
          ARTIFACT_DIGEST: ${{ needs.readiness.outputs.artifact_digest }}
          ALLOWED_APPVIEW_SHAS: ${{ needs.readiness.outputs.allowed_appview_shas }}
          READINESS_RESULT: ${{ needs.readiness.result }}
          FULL_RESULT: ${{ needs.full.result }}
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          source_sha="${SOURCE_SHA:-$(git rev-parse --verify HEAD^{commit})}"
          artifact_digest="$ARTIFACT_DIGEST"
          allowed_appview_shas="$ALLOWED_APPVIEW_SHAS"
          if [ -z "$artifact_digest" ]; then
            artifact_digest="$(deno task release:web-digest)"
          fi
          if [ -z "$allowed_appview_shas" ]; then
            allowed_appview_shas="$(deno task release:web-changed -- \
              --sha="$source_sha" --allowed-appview-shas)"
          fi
          deno run --allow-env --allow-run=git,gh scripts/reconcile-production-smoke-alerts.ts \
            --repository="$GITHUB_REPOSITORY" \
            --run-url="$run_url" \
            --source-sha="$source_sha" \
            --artifact-digest="$artifact_digest" \
            --allowed-appview-shas="$allowed_appview_shas" \
            --readiness-result="$READINESS_RESULT" \
            --full-result="$FULL_RESULT"
